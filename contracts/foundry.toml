[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.38"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
# BSC mainnet (chain id 56) — fork tests pin a block, see test/AurumAgentsFork.t.sol
[rpc_endpoints]
bsc = "https://bsc-dataseed.bnbchain.org"
bsc_public = "https://bsc-dataseed-public.bnbchain.org"
bsc_publicnode = "https://bsc-rpc.publicnode.com"
